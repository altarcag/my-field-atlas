name: Publish upload API
on:
  push:
    branches: [main]
    paths: ['app/api/**', 'worker/**', 'lib/**', 'drizzle/**', 'scripts/deploy-api.mjs', 'wrangler.jsonc', 'package.json', 'pnpm-lock.yaml', '.github/workflows/api.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upload-api
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.CLOUDFLARE_D1_DATABASE_ID != '' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test
      - run: pnpm deploy:api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
